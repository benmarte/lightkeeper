<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lightkeeper</title>
<style>
/* Written for old engines (Chromium 53 on webOS 4, 79 on webOS 6): ES5, no inset, no flex gap. */
/* Before Chromium 62 there are no variable fonts: fixed weights first, then the variable
   face, which newer engines use for every weight. Each in-between weight follows a fallback. */
@font-face { font-family: Jost; src: url(jost-200.woff2) format('woff2'); font-weight: 200; }
@font-face { font-family: Jost; src: url(jost-300.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: Jost; src: url(jost-500.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Jost; src: url(jost.woff2) format('woff2'); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body {
  font-family: Jost, sans-serif; color: #f4f1ec;
  background: url(backgrounds/godrevy.jpg) center / cover no-repeat #000;
  text-shadow: 0 2px 24px rgba(0, 0, 0, .5);
}
/* The veil: dark from the top left for the time, from the bottom for the tiles.
   Its opacity is the strength set in the settings. */
#veil {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  background:
    radial-gradient(1100px 620px at 0 0, rgba(18,13,8,.92) 0, rgba(18,13,8,0) 100%),
    linear-gradient(to top, rgba(18,13,8,1) 0, rgba(18,13,8,.7) 20%, rgba(18,13,8,0) 50%);
}
header, nav, #hint { position: absolute; left: 112px; }
header { top: 68px; }
#ora { font-size: 150px; font-weight: 200; line-height: 1; letter-spacing: -.02em; }
#ora small { font-size: 52px; font-weight: 300; letter-spacing: .02em; margin-left: 14px; }
#meteo { margin-top: 18px; height: 40px; font-size: 34px; font-weight: 300; opacity: .9; display: flex; align-items: center; }
#meteo svg { width: 34px; height: 34px; margin-left: 14px; }
nav { bottom: 104px; display: flex; align-items: flex-end; transition: -webkit-transform .2s, transform .2s; }
nav a { position: relative; margin-right: 72px; font-size: 44px; font-weight: 400; font-weight: 380; letter-spacing: .01em; opacity: .72; cursor: pointer; transition: opacity .2s; }
nav a.sel { opacity: 1; font-weight: 500; font-weight: 450; }
nav a.sel::after {
  content: ""; position: absolute; left: 0; bottom: -20px;
  width: 36px; height: 3px; border-radius: 2px; background: currentColor;
}
/* Icons: the app's own icon above its name. */
nav i { font-style: normal; }
nav.icons { margin-left: -28px; }
nav.icons a { width: 188px; margin-right: 24px; font-size: 30px; text-align: center; }
nav.icons a.gear { width: auto; margin-left: 12px; }
nav.icons i { display: block; font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.icons img {
  display: block; width: 132px; height: 132px; margin: 0 auto 20px; border-radius: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45); transition: transform .2s;
}
nav.icons a.sel img { -webkit-transform: scale(1.06); transform: scale(1.06); }
/* A logo, white like the words: no frame, as the brands ask, a shadow to read over the picture. */
nav.icons .logo {
  display: flex; align-items: center; justify-content: center; height: 132px; margin-bottom: 20px;
  -webkit-filter: drop-shadow(0 2px 14px rgba(0, 0, 0, .5)); filter: drop-shadow(0 2px 14px rgba(0, 0, 0, .5));
  transition: transform .2s;
}
nav.icons .logo svg, nav.icons .logo img { display: block; }
nav.icons .logo img, nav.icons a.sel .logo img { margin: 0; border-radius: 0; box-shadow: none; -webkit-transform: none; transform: none; }
nav.icons a.sel .logo { -webkit-transform: scale(1.06); transform: scale(1.06); }
nav.icons a.sel::after { bottom: -16px; left: 50%; margin-left: -18px; }
/* Names under logos and icons: only the selected one's, smaller; or none, the line under the icon alone. */
nav.icons.only-sel i { visibility: hidden; font-size: 26px; }
nav.icons.only-sel a.sel i { visibility: visible; }
nav.icons.bare i { display: none; }
nav.icons.bare .logo, nav.icons.bare img { margin-bottom: 0; }
nav.icons.bare a.gear { -webkit-align-self: center; align-self: center; }
/* The gear after the tiles opens the settings. */
nav a.gear { margin-right: 0; }
nav a.gear svg { display: block; width: 46px; height: 46px; margin-bottom: 2px; }
nav.icons a.gear svg { width: 52px; height: 52px; margin-bottom: 4px; }
#hint {
  bottom: 50px; font-size: 26px; font-weight: 300; font-weight: 350; opacity: 0; transition: opacity .2s;
  white-space: nowrap;
}
#hint.on { opacity: .8; }
</style>
</head>
<body>
<div id="veil"></div>
<header><div id="ora"></div><div id="meteo"></div></header>
<nav></nav>
<div id="hint"></div>
<script src="logos.js"></script>
<script>
var APP_VERSION = '1.0.3';
var LG_HOME = 'com.webos.app.home';
var BROWSER = 'com.webos.app.browser';
var EXEC = 'luna://org.webosbrew.hbchannel.service/exec';
// The settings server's port: 8090 unless chosen otherwise, kept from its last answer.
var porta = 8090;
try { porta = +localStorage.getItem('port') || 8090; } catch (e) {}
function server() { return 'http://127.0.0.1:' + porta; }
// This page's own directory, which holds the server under service/.
var APP_DIR = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));

var TEXT = { settings: 'Settings', phone: 'or on your phone: ', empty: 'Choose your tiles in Settings' };

var nav = document.querySelector('nav');
var ora = document.getElementById('ora');
var meteoEl = document.getElementById('meteo');
var hint = document.getElementById('hint');
var veil = document.getElementById('veil');
var sistema = window.webOSSystem || window.PalmSystem;
var chiamate = []; // the bridges stay alive until the service answers

var cfg = cached() || { tiles: [], veil: 80, clock: '24', tileStyle: 'text', units: 'c', weather: null, background: {} };
var shown = '';     // the config the page shows, as JSON
var voci = [];      // the tiles, then the gear
var sel = 0;
var meteoAlle = 0, meteoPer = '';

function cached() {
  try { return JSON.parse(localStorage.getItem('config')); } catch (e) { return null; }
}

function luna(uri, params, cb) {
  if (!window.PalmServiceBridge) { console.log(uri + ' ' + JSON.stringify(params)); return; } // preview on a computer
  var b = new PalmServiceBridge();
  chiamate.push(b);
  b.onservicecallback = function (msg) {
    chiamate.splice(chiamate.indexOf(b), 1);
    if (cb) { var r = {}; try { r = JSON.parse(msg); } catch (e) {} cb(r); }
  };
  b.call(uri, JSON.stringify(params));
}

function apri(id, params) {
  luna('luna://com.webos.applicationManager/launch', params ? { id: id, params: params } : { id: id });
}

function ultima() {
  try { return +localStorage.getItem('ultima') || 0; } catch (e) { return 0; }
}

var spostamento = 0; // how far a row wider than the screen has slid
function seleziona(i, colPuntatore) {
  sel = Math.max(0, Math.min(voci.length - 1, i));
  for (var k = 0; k < nav.children.length; k++) nav.children[k].className = (k === sel ? 'sel' : '') + (voci[k].gear ? ' gear' : '');
  // A row wider than the screen slides, with the arrows only, so the chosen tile stays in view.
  var el = nav.children[sel], largo = 1920 - 224;
  if (el && !colPuntatore) {
    if (el.offsetLeft + el.offsetWidth > spostamento + largo) spostamento = el.offsetLeft + el.offsetWidth - largo;
    if (el.offsetLeft < spostamento) spostamento = el.offsetLeft;
    nav.style.webkitTransform = nav.style.transform = 'translateX(' + -spostamento + 'px)';
    caricaVisibili();
  }
  var t = TEXT;
  if (voci[sel] && voci[sel].gear) {
    hint.textContent = (voci.length === 1 ? t.empty : t.settings) +
      (cfg.address ? ' · ' + t.phone + cfg.address + ':' + (cfg.port || porta) : '');
    hint.className = 'on';
  } else {
    hint.className = '';
  }
}

function lancia(i) {
  if (voci[i].gear) return apri(BROWSER, { target: server() + '/' });
  try { localStorage.setItem('ultima', String(i)); } catch (e) {}
  apri(voci[i].id);
}

function iconaTv(url) {
  var img = document.createElement('img');
  img.src = url;
  img.onerror = function () { img.style.visibility = 'hidden'; };
  return img;
}

/*
 * What fills a tile's place for its picture: its logo; else, with logos chosen, the
 * app's icon made white; else the TV's own icon. The icon is asked for only once,
 * with CORS: a copy loaded plainly first would taint the canvas.
 */
function riempi(box, v, modo) {
  return function () {
    var logo = logoDi(v, modo);
    if (logo) return box.appendChild(disegnaLogo(logo, 80, 176, 96));
    var url = server() + '/icon?id=' + encodeURIComponent(v.id) + '&s=' + (cfg.started || 0);
    if (modo !== 'logo') return box.parentNode.replaceChild(iconaTv(url), box);
    iconaBianca(url, function (w) {
      if (w) box.appendChild(misuraBianca(w, 80, 176, 96));
      else if (box.parentNode) box.parentNode.replaceChild(iconaTv(url), box);
    });
  };
}

// Up to fifty tiles: pictures are drawn as they come within a screen of view, not all at once.
var caricatori = [];
function caricaVisibili() {
  var da = spostamento - 1920, fino = spostamento + 2 * 1920;
  for (var k = 0; k < caricatori.length; k++) {
    var el = caricatori[k] && nav.children[k];
    if (el && el.offsetLeft + el.offsetWidth >= da && el.offsetLeft <= fino) {
      var f = caricatori[k];
      caricatori[k] = null;
      f();
    }
  }
}

var GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
  '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>' +
  '<circle cx="12" cy="12" r="6.6"/></svg>';

function disegna() {
  // Names only; logos, or the TV's icon where an app has none; the TV's icons. Inputs show their device.
  var modo = cfg.tileStyle === 'logo' || cfg.tileStyle === 'icon' ? cfg.tileStyle : 'text';
  nav.className = modo === 'text' ? '' : 'icons' + (cfg.labels === 'none' ? ' bare' : cfg.labels === 'selected' ? ' only-sel' : '');
  nav.innerHTML = '';
  spostamento = 0;
  caricatori = [];
  voci = (cfg.tiles || []).slice();
  voci.push({ gear: true });
  voci.forEach(function (v, i) {
    var a = document.createElement('a');
    if (v.gear) {
      a.innerHTML = GEAR;
      a.setAttribute('aria-label', TEXT.settings);
    } else {
      if (modo !== 'text') {
        var box = document.createElement('div');
        box.className = 'logo';
        a.appendChild(box);
        caricatori[i] = riempi(box, v, modo);
      }
      // The name stays for screen readers when it is not shown.
      a.setAttribute('aria-label', v.title);
      var label = document.createElement('i');
      label.textContent = v.title;
      a.appendChild(label);
    }
    a.onmouseover = function () { seleziona(i, true); };
    a.onclick = function () { lancia(i); };
    nav.appendChild(a);
  });
  veil.style.opacity = (typeof cfg.veil === 'number' ? cfg.veil : 80) / 100;
  // An uploaded picture comes from the server; the app's own backgrounds are beside this page.
  // With the server's start in the address: a picture that failed while it was down is asked again.
  var mio = cfg.background && cfg.background.custom ?
    'url(' + server() + '/background.jpg?rev=' + cfg.background.rev + '&s=' + (cfg.started || 0) + '), ' : '';
  var preset = /^[a-z0-9-]+$/.test(cfg.preset || '') ? cfg.preset : 'godrevy';
  document.body.style.backgroundImage = mio + 'url(backgrounds/' + preset + '.jpg)';
  seleziona(Math.min(ultima(), voci.length - 1));
  aggiorna();
}

document.addEventListener('keydown', function (e) {
  if (e.keyCode === 37) seleziona(sel - 1);
  else if (e.keyCode === 39) seleziona(sel + 1);
  else if (e.keyCode === 13) lancia(sel);
  else if (e.keyCode === 40) apri(LG_HOME); // Down: LG's Home
  else if (e.keyCode === 461 && sistema) sistema.platformBack(); // Back
  else return;
  e.preventDefault();
});

// The weather icons, from Open-Meteo's WMO codes. Not ICONE, which is logos.js's.
var NUVOLA_ALTA = '<path d="M6.5 15h11a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.3 8.1 3.5 3.5 0 0 0 6.5 15z"/>';
var METEO = {
  sole: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  luna: '<path d="M20 14.6A8.2 8.2 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6z"/>',
  nuvola: '<path d="M6.5 18h11a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.3 11.1 3.5 3.5 0 0 0 6.5 18z"/>',
  nebbia: '<path d="M4 9h16M6 13h12M4 17h16"/>',
  pioggia: NUVOLA_ALTA + '<path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/>',
  neve: NUVOLA_ALTA + '<path d="M8 19.5h.01M12 19.5h.01M16 19.5h.01" stroke-width="2.4"/>',
  temporale: NUVOLA_ALTA + '<path d="M12.5 16l-2 3h3l-2 3"/>'
};

function icona(codice, giorno) {
  var nome = codice <= 1 ? (giorno ? 'sole' : 'luna') : codice <= 3 ? 'nuvola' : codice <= 48 ? 'nebbia' :
    codice >= 95 ? 'temporale' : (codice >= 71 && codice <= 77) || codice === 85 || codice === 86 ? 'neve' : 'pioggia';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
    METEO[nome] + '</svg>';
}

function meteo() {
  var w = cfg.weather;
  meteoPer = w ? w.lat + ',' + w.lon + ',' + cfg.units : '';
  meteoAlle = Date.now();
  if (!w) { meteoEl.innerHTML = ''; return; }
  meteoEl.textContent = w.name;
  var x = new XMLHttpRequest();
  x.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + w.lat + '&longitude=' + w.lon +
    '&current=temperature_2m,weather_code,is_day&timezone=auto' + (cfg.units === 'f' ? '&temperature_unit=fahrenheit' : ''));
  x.timeout = 8000;
  x.onload = function () {
    try {
      var c = JSON.parse(x.responseText).current;
      meteoEl.textContent = w.name + ' · ' + Math.round(c.temperature_2m) + '°';
      meteoEl.insertAdjacentHTML('beforeend', icona(c.weather_code, c.is_day));
    } catch (e) {}
  };
  x.send();
}

function aggiorna() {
  var d = new Date(), h = d.getHours(), m = (d.getMinutes() < 10 ? ':0' : ':') + d.getMinutes();
  if (cfg.clock === '12') ora.innerHTML = ((h + 11) % 12 + 1) + m + '<small>' + (h < 12 ? 'AM' : 'PM') + '</small>';
  else ora.textContent = h + m;
  var per = cfg.weather ? cfg.weather.lat + ',' + cfg.weather.lon + ',' + cfg.units : '';
  if (per !== meteoPer || Date.now() - meteoAlle > 15 * 60000) meteo();
}

/*
 * The config comes from the server on this TV, and is kept here so the Home
 * shows at once at power on, before the server is up. cb(answered).
 */
function leggi(cb) {
  var x = new XMLHttpRequest();
  x.open('GET', server() + '/api/config');
  x.timeout = 3000;
  x.onload = function () {
    var c = null;
    try { c = JSON.parse(x.responseText); } catch (e) {}
    if (!c || !c.version) return cb && cb(null);
    if (c.port && c.port !== porta) {
      porta = c.port;
      try { localStorage.setItem('port', String(porta)); } catch (e) {}
    }
    var j = JSON.stringify(c);
    if (j !== shown) {
      shown = j;
      cfg = c;
      try { localStorage.setItem('config', j); } catch (e) {}
      disegna();
    }
    if (cb) cb(c);
  };
  x.onerror = x.ontimeout = function () { if (cb) cb(null); };
  x.send();
}

/*
 * When the server does not answer, or answers with an older version, the
 * Homebrew Channel, which runs as root, is asked to put it in place: once per
 * launch, as the server may simply not have started yet after a cold boot.
 */
var setupFatto = false;
function setup() {
  if (setupFatto || !window.PalmServiceBridge) return;
  setupFatto = true;
  luna(EXEC, { command: 'sh "' + APP_DIR + '/service/setup.sh"' }, function () { leggi(); });
}

function controlla(prove) {
  leggi(function (c) {
    if (c && c.version === APP_VERSION) return;
    if (c) return setup();
    if (prove > 1) return setTimeout(function () { controlla(prove - 1); }, 1500);
    trovaPorta(function (nuova) { if (nuova) controlla(2); else setup(); });
  });
}

/*
 * The port the server wrote it is on, asked of the Homebrew Channel when the
 * server does not answer where it was: moved while the Home was hidden, or on
 * another port at start because a different program had this one. cb(moved).
 */
var cercata = 0;
function trovaPorta(cb) {
  if (!window.PalmServiceBridge || Date.now() - cercata < 30000) return cb(false);
  cercata = Date.now();
  luna(EXEC, { command: 'cat /tmp/lightkeeper.port' }, function (r) {
    var p = parseInt(r && r.stdoutString, 10);
    if (!(p > 0) || p === porta) return cb(false);
    porta = p;
    try { localStorage.setItem('port', String(p)); } catch (e) {}
    cb(true);
  });
}

document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { aggiorna(); leggi(); }
});

// Home key with the app already open: with handlesRelaunch it comes to the front only if it asks.
document.addEventListener('webOSRelaunch', function () {
  if (sistema) sistema.activate();
  seleziona(Math.min(ultima(), voci.length - 1));
  aggiorna();
  leggi();
});

disegna();
controlla(5);
setInterval(aggiorna, 5000);
// Changes made on a phone show within seconds; nothing is asked while hidden.
var mancate = 0;
setInterval(function () {
  if (document.hidden) return;
  leggi(function (c) {
    mancate = c ? 0 : mancate + 1;
    if (mancate >= 3) trovaPorta(function (nuova) { if (nuova) leggi(); });
  });
}, 4000);
</script>
</body>
</html>
